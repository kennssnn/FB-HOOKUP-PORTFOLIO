<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>kntxr_</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Tokens ── */
    :root {
      --red:        #D91A1A;
      --red-mid:    #FF3B3B;
      --red-light:  #FF6B6B;
      --red-glow:   rgba(217, 26, 26, 0.22);
      --red-glow-x: rgba(217, 26, 26, 0.50);

      /* Dark theme */
      --bg:            #080808;
      --bg-elevated:   #111111;
      --card-bg:       rgba(255, 255, 255, 0.032);
      --card-bg-hover: rgba(255, 255, 255, 0.062);
      --text:          #F0EEE8;
      --text-muted:    rgba(240, 238, 232, 0.42);
      --border:        rgba(255, 255, 255, 0.07);
      --border-hover:  rgba(217, 26, 26, 0.55);
      --toggle-bg:     rgba(255, 255, 255, 0.05);
      --scroll-track:  rgba(255, 255, 255, 0.03);
      --grid-line:     rgba(255, 255, 255, 0.018);
      --orb-1:         rgba(217, 26, 26, 0.18);
      --orb-2:         rgba(217, 26, 26, 0.07);
    }

    [data-theme="light"] {
      --bg:            #F5F3F0;
      --bg-elevated:   #ECEAE6;
      --card-bg:       rgba(0, 0, 0, 0.028);
      --card-bg-hover: rgba(0, 0, 0, 0.055);
      --text:          #0D0D0D;
      --text-muted:    rgba(13, 13, 13, 0.44);
      --border:        rgba(0, 0, 0, 0.08);
      --border-hover:  rgba(185, 15, 15, 0.45);
      --toggle-bg:     rgba(0, 0, 0, 0.055);
      --scroll-track:  rgba(0, 0, 0, 0.04);
      --grid-line:     rgba(0, 0, 0, 0.04);
      --orb-1:         rgba(185, 15, 15, 0.10);
      --orb-2:         rgba(185, 15, 15, 0.04);
      --red:           #B50E0E;
      --red-mid:       #D42020;
      --red-light:     #E84545;
      --red-glow:      rgba(185, 14, 14, 0.15);
      --red-glow-x:    rgba(185, 14, 14, 0.38);
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: var(--scroll-track); }
    ::-webkit-scrollbar-thumb { background: var(--red); border-radius: 2px; }
    * { scrollbar-width: thin; scrollbar-color: var(--red) var(--scroll-track); }

    /* ── Base ── */
    html { scroll-behavior: smooth; }

    body {
      font-family: 'Syne', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem 3rem;
      overflow-x: hidden;
      transition: background 0.55s cubic-bezier(0.4,0,0.2,1),
                  color 0.55s cubic-bezier(0.4,0,0.2,1);
    }

    /* ── Background atmosphere ── */
    .bg-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .bg-orbs {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      transition: opacity 0.55s ease;
    }

    .bg-orbs::before {
      content: '';
      position: absolute;
      top: -10%;
      left: -15%;
      width: 60vmax;
      height: 60vmax;
      border-radius: 50%;
      background: radial-gradient(circle, var(--orb-1) 0%, transparent 65%);
      animation: orbFloat 18s ease-in-out infinite alternate;
    }

    .bg-orbs::after {
      content: '';
      position: absolute;
      bottom: -10%;
      right: -10%;
      width: 50vmax;
      height: 50vmax;
      border-radius: 50%;
      background: radial-gradient(circle, var(--orb-2) 0%, transparent 65%);
      animation: orbFloat 22s ease-in-out infinite alternate-reverse;
    }

    @keyframes orbFloat {
      0%   { transform: translate(0, 0) scale(1); }
      100% { transform: translate(4%, 3%) scale(1.08); }
    }

    .bg-grid {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image:
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
      background-size: 64px 64px;
      transition: background-image 0.55s ease;
    }

    /* ── Layout ── */
    .wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Toggle ── */
    .toggle-btn {
      position: fixed;
      top: 1.4rem;
      right: 1.4rem;
      z-index: 200;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--toggle-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition:
        background 0.4s ease,
        border-color 0.3s ease,
        color 0.3s ease,
        box-shadow 0.3s ease,
        transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
    }

    .toggle-btn:hover {
      border-color: var(--red);
      color: var(--red);
      box-shadow: 0 0 16px var(--red-glow-x), 0 0 4px var(--red-glow);
      transform: scale(1.08) rotate(12deg);
    }

    .toggle-btn .icon-wrap {
      position: relative;
      width: 18px;
      height: 18px;
    }

    .toggle-btn .icon-wrap i {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .toggle-btn .icon-sun  { opacity: 0; transform: rotate(90deg) scale(0.5); }
    .toggle-btn .icon-moon { opacity: 1; transform: rotate(0deg) scale(1); }

    [data-theme="light"] .toggle-btn .icon-sun  { opacity: 1; transform: rotate(0deg) scale(1); }
    [data-theme="light"] .toggle-btn .icon-moon { opacity: 0; transform: rotate(-90deg) scale(0.5); }

    /* ── Header ── */
    .header {
      text-align: center;
      margin-bottom: 2.8rem;
      opacity: 0;
      transform: translateY(-24px);
      animation: fadeUp 0.9s cubic-bezier(0.22,1,0.36,1) 0.08s forwards;
    }

    .logo-wrap {
      position: relative;
      display: inline-block;
      cursor: default;
    }

    .logo {
      font-family: 'Space Mono', monospace;
      font-size: clamp(2.6rem, 9vw, 4.2rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--text);
      position: relative;
      display: inline-block;
      user-select: none;
      transition: color 0.55s ease;
    }

    .logo .accent { color: var(--red); }

    /* Glitch layers */
    .logo-ghost {
      position: absolute;
      left: 0; top: 0;
      font-family: 'Space Mono', monospace;
      font-size: clamp(2.6rem, 9vw, 4.2rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      pointer-events: none;
      user-select: none;
    }

    .logo-ghost.g1 {
      color: var(--red-mid);
      animation: glitch1 7s infinite;
    }

    .logo-ghost.g2 {
      color: var(--red-light);
      animation: glitch2 7s infinite;
    }

    @keyframes glitch1 {
      0%,89%,100% { opacity:0; clip-path:none; transform:none; }
      90%          { opacity:.6; clip-path:polygon(0 12%,100% 12%,100% 32%,0 32%); transform:translateX(-4px); }
      92%          { opacity:.6; clip-path:polygon(0 58%,100% 58%,100% 76%,0 76%); transform:translateX(3px); }
      94%          { opacity:0; }
    }

    @keyframes glitch2 {
      0%,90%,100% { opacity:0; clip-path:none; transform:none; }
      91%          { opacity:.4; clip-path:polygon(0 40%,100% 40%,100% 55%,0 55%); transform:translateX(5px); }
      93%          { opacity:.4; clip-path:polygon(0 70%,100% 70%,100% 85%,0 85%); transform:translateX(-3px); }
      95%          { opacity:0; }
    }

    .logo-underline {
      display: block;
      margin-top: 4px;
      height: 2px;
      width: 100%;
      background: linear-gradient(90deg, var(--red), var(--red-light), transparent);
      border-radius: 1px;
      transform: scaleX(0);
      transform-origin: left;
      animation: lineReveal 0.8s cubic-bezier(0.22,1,0.36,1) 0.6s forwards;
    }

    @keyframes lineReveal {
      to { transform: scaleX(1); }
    }

    .tagline {
      margin-top: 1rem;
      font-size: 0.68rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--text-muted);
      transition: color 0.55s ease;
    }

    .tagline-dot {
      display: inline-block;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--red);
      vertical-align: middle;
      margin: 0 0.5em;
      box-shadow: 0 0 6px var(--red);
    }

    /* ── Social card ── */
    .social-card {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      opacity: 0;
      transform: translateY(28px);
      animation: fadeUp 0.9s cubic-bezier(0.22,1,0.36,1) 0.32s forwards;
      transition:
        background 0.55s ease,
        border-color 0.35s ease,
        box-shadow 0.35s ease;
    }

    .social-card:hover {
      border-color: var(--border-hover);
      box-shadow: 0 0 30px var(--red-glow), 0 8px 32px rgba(0,0,0,0.25);
    }

    .card-header {
      padding: 1rem 1.4rem 0.8rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 0.6rem;
      transition: border-color 0.55s ease;
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--red);
      box-shadow: 0 0 0 0 var(--red-glow-x);
      animation: pulse 2.6s ease-in-out infinite;
      flex-shrink: 0;
    }

    @keyframes pulse {
      0%,100% { box-shadow: 0 0 0 0 var(--red-glow-x); }
      60%      { box-shadow: 0 0 0 5px transparent; }
    }

    .card-header-label {
      font-size: 0.67rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text-muted);
      transition: color 0.55s ease;
    }

    .card-header-count {
      margin-left: auto;
      font-family: 'Space Mono', monospace;
      font-size: 0.65rem;
      color: var(--red);
      opacity: 0.7;
    }

    /* Social list */
    .social-list {
      padding: 0.4rem 0;
    }

    .social-link {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.85rem 1.4rem;
      text-decoration: none;
      color: var(--text);
      position: relative;
      overflow: hidden;
      transition: background 0.22s ease;
    }

    .social-link::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 2px;
      background: linear-gradient(180deg, var(--red-light), var(--red));
      border-radius: 0 1px 1px 0;
      transform: scaleY(0);
      transform-origin: center;
      box-shadow: 0 0 10px var(--red-glow-x);
      transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    }

    /* Shimmer sweep on hover */
    .social-link::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(105deg,
        transparent 30%,
        rgba(255,255,255,0.028) 50%,
        transparent 70%);
      transform: translateX(-120%);
      transition: transform 0.55s ease;
    }

    .social-link:hover::before { transform: scaleY(1); }
    .social-link:hover::after  { transform: translateX(120%); }
    .social-link:hover         { background: var(--card-bg-hover); }

    .social-link:hover .s-icon  { color: var(--red); transform: scale(1.12) rotate(-4deg); }
    .social-link:hover .s-arrow { opacity: 1; transform: translateX(0); }
    .social-link:hover .s-platform { color: var(--red); }

    .s-icon-wrap {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: var(--card-bg);
      transition: border-color 0.3s ease, background 0.3s ease;
    }

    .social-link:hover .s-icon-wrap {
      border-color: var(--border-hover);
      background: rgba(217,26,26,0.08);
    }

    .s-icon {
      font-size: 17px;
      color: var(--text-muted);
      transition: color 0.3s ease, transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
    }

    .s-info {
      flex: 1;
      min-width: 0;
    }

    .s-platform {
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--text);
      line-height: 1;
      margin-bottom: 3px;
      transition: color 0.25s ease;
    }

    .s-handle {
      font-family: 'Space Mono', monospace;
      font-size: 0.67rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color 0.55s ease;
    }

    .s-arrow {
      color: var(--red);
      font-size: 11px;
      opacity: 0;
      transform: translateX(-8px);
      transition: opacity 0.25s ease, transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
      flex-shrink: 0;
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 0 1.4rem;
      transition: background 0.55s ease;
    }

    /* staggered entrance for each row */
    .social-link { opacity: 0; animation: fadeRight 0.7s cubic-bezier(0.22,1,0.36,1) forwards; }
    .social-link:nth-child(1) { animation-delay: 0.45s; }
    .social-link:nth-child(3) { animation-delay: 0.58s; }
    .social-link:nth-child(5) { animation-delay: 0.71s; }
    .social-link:nth-child(7) { animation-delay: 0.84s; }

    @keyframes fadeRight {
      from { opacity:0; transform:translateX(-14px); }
      to   { opacity:1; transform:translateX(0); }
    }

    /* ── Footer ── */
    .footer {
      margin-top: 2rem;
      font-size: 0.64rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-muted);
      text-align: center;
      opacity: 0;
      animation: fadeUp 0.8s ease 1s forwards;
      transition: color 0.55s ease;
    }

    .footer em { color: var(--red); font-style: normal; }

    /* ── Keyframes ── */
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(20px); }
      to   { opacity:1; transform:translateY(0); }
    }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      .wrap { max-width: 100%; }
      .logo { font-size: 2.4rem; }
      .social-link { padding: 0.78rem 1.1rem; }
      .card-header { padding: 0.85rem 1.1rem 0.7rem; }
      .divider { margin: 0 1.1rem; }
      .toggle-btn { top: 1rem; right: 1rem; width: 38px; height: 38px; }
    }

    @media (min-width: 768px) {
      .wrap { max-width: 460px; }
    }
  </style>
</head>
<body>
  <!-- Ambient background -->
  <div class="bg-orbs" aria-hidden="true"></div>
  <div class="bg-grid"  aria-hidden="true"></div>

  <!-- Theme toggle -->
  <button class="toggle-btn" id="toggleBtn" aria-label="Toggle light/dark mode">
    <span class="icon-wrap" aria-hidden="true">
      <i class="fa-solid fa-sun  icon-sun"></i>
      <i class="fa-solid fa-moon icon-moon"></i>
    </span>
  </button>

  <!-- Main content -->
  <main class="wrap">

    <!-- Header -->
    <header class="header" role="banner">
      <div class="logo-wrap">
        <!-- Glitch ghost layers -->
        <span class="logo-ghost g1" aria-hidden="true">kntxr_</span>
        <span class="logo-ghost g2" aria-hidden="true">kntxr_</span>
        <!-- Real logo -->
        <h1 class="logo">kntxr<span class="accent">_</span></h1>
        <span class="logo-underline" aria-hidden="true"></span>
      </div>
      <p class="tagline">
        live your life
        <span class="tagline-dot" aria-hidden="true"></span>
        to the fullest
      </p>
    </header>

    <!-- Social links -->
    <section class="social-card" aria-label="Social media links">
      <div class="card-header">
        <span class="pulse-dot" aria-hidden="true"></span>
        <span class="card-header-label"></span>
        <span class="card-header-count">04 links</span>
      </div>

      <nav class="social-list" aria-label="Social platforms">

        <a class="social-link" href="https://www.instagram.com/kntxr_/" target="_blank" rel="noopener noreferrer" aria-label="Instagram profile">
          <div class="s-icon-wrap">
            <i class="fa-brands fa-instagram s-icon" aria-hidden="true"></i>
          </div>
          <div class="s-info">
            <div class="s-platform">Instagram</div>
            <div class="s-handle">@kntxr_</div>
          </div>
          <i class="fa-solid fa-arrow-right s-arrow" aria-hidden="true"></i>
        </a>

        <div class="divider" role="separator"></div>

        <a class="social-link" href="https://www.facebook.com/kntxr/" target="_blank" rel="noopener noreferrer" aria-label="Facebook profile">
          <div class="s-icon-wrap">
            <i class="fa-brands fa-facebook-f s-icon" aria-hidden="true"></i>
          </div>
          <div class="s-info">
            <div class="s-platform">Facebook</div>
            <div class="s-handle">kntxr</div>
          </div>
          <i class="fa-solid fa-arrow-right s-arrow" aria-hidden="true"></i>
        </a>

        <div class="divider" role="separator"></div>

        <a class="social-link" href="https://www.tiktok.com/@kntxr_" target="_blank" rel="noopener noreferrer" aria-label="TikTok profile">
          <div class="s-icon-wrap">
            <i class="fa-brands fa-tiktok s-icon" aria-hidden="true"></i>
          </div>
          <div class="s-info">
            <div class="s-platform">TikTok</div>
            <div class="s-handle">@kntxr_</div>
          </div>
          <i class="fa-solid fa-arrow-right s-arrow" aria-hidden="true"></i>
        </a>

        <div class="divider" role="separator"></div>

        <a class="social-link" href="https://github.com/kennssnn" target="_blank" rel="noopener noreferrer" aria-label="GitHub profile">
          <div class="s-icon-wrap">
            <i class="fa-brands fa-github s-icon" aria-hidden="true"></i>
          </div>
          <div class="s-info">
            <div class="s-platform">GitHub</div>
            <div class="s-handle">kennssnn</div>
          </div>
          <i class="fa-solid fa-arrow-right s-arrow" aria-hidden="true"></i>
        </a>

      </nav>
    </section>

    <!-- Footer -->
    <footer class="footer">
      &copy; 2026 <em>kntxr_</em> &nbsp;&middot;&nbsp; heads up
    </footer>

  </main>

  <script>
    (function () {
      const btn  = document.getElementById('toggleBtn');
      const root = document.documentElement;

      const saved = localStorage.getItem('kntxr-theme');
      if (saved) root.dataset.theme = saved;

      btn.addEventListener('click', () => {
        const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
        root.dataset.theme = next;
        localStorage.setItem('kntxr-theme', next);
      });
    })();
  </script>
</body>
</html>
